name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock*.json"

      - name: Restore
        run: dotnet restore --configfile NuGet.config --locked-mode

      - name: Build
        run: dotnet build --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --no-build --no-restore --results-directory TestResults --logger trx --collect "Code Coverage;Format=cobertura"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults/*.trx
          if-no-files-found: error

  openspec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate active OpenSpec artifacts
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive

      - name: Validate archived OpenSpec tasks
        run: npx --yes @fission-ai/openspec@1.14.3 validate --archived --no-interactive

  duplication:
    name: C# Duplication
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan C# duplication
        id: jscpd
        uses: kucherenko/jscpd@b82d84186389590fed0813d005391f3b8147dcfa # v5.4.3
        with:
          version: '5.4.3'
          config: .jscpd.json
          reporters: console,json,sarif
          baseline-from-ref: ${{ github.event.pull_request.base.sha }}
          fail-on-new-clones: true
          fail-on-empty: true
          upload-report: true
          upload-sarif: false

      - name: Upload duplication SARIF
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report/jscpd-report.sarif

      - name: Enforce duplication result
        if: always()
        env:
          JSCPD_EXIT_CODE: ${{ steps.jscpd.outputs.exit-code }}
        run: test "$JSCPD_EXIT_CODE" = "0"

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hagalaz.Web.App
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: Hagalaz.Web.App/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: Hagalaz.Web.App/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint webapp with Biome
        run: pnpm run lint:biome
      - name: Audit webapp with Fallow
        uses: fallow-rs/fallow@8cc305d74aeb77b7ab316388f8ab41cce20a394f # v3.43.1
        with:
          root: Hagalaz.Web.App
          command: audit
          type-aware: 'true'
      - name: Test webapp
        run: pnpm run test
      - name: Test admin webapp
        run: pnpm run admin:test
      - name: Build webapp
        run: pnpm run build
      - name: Build admin webapp
        run: pnpm run admin:build
