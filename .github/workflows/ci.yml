name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock*.json"

      - name: Restore
        run: dotnet restore --configfile NuGet.config --locked-mode

      - name: Build
        run: dotnet build --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --no-build --no-restore -p:TestingPlatformCommandLineArguments="--report-trx --coverage --coverage-output-format cobertura"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"

  openspec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate active OpenSpec artifacts
        run: npx --yes @fission-ai/openspec@1.10.0 validate --all --strict --no-interactive

      - name: Validate archived OpenSpec tasks
        run: npx --yes @fission-ai/openspec@1.10.0 validate --archived --no-interactive

  duplication:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository and target branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan C# duplication
        id: jscpd
        uses: kucherenko/jscpd@v5.3.2
        with:
          version: '5.3.2'
          config: .jscpd.json
          reporters: console,json,sarif
          baseline-from-ref: origin/${{ github.base_ref }}
          fail-on-new-clones: true
          fail-on-empty: true
          upload-sarif: false

      - name: Upload duplication SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report/jscpd-report.sarif

      - name: Enforce duplication result
        if: always()
        env:
          JSCPD_EXIT_CODE: ${{ steps.jscpd.outputs.exit-code }}
        run: test "$JSCPD_EXIT_CODE" = "0"

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hagalaz.Web.App
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: Hagalaz.Web.App/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint webapp with Biome
        run: pnpm run lint:biome
      - name: Audit webapp with Fallow
        uses: fallow-rs/fallow@v3
        with:
          root: Hagalaz.Web.App
          command: audit
      - name: Test webapp
        run: pnpm run test
      - name: Test admin webapp
        run: pnpm run admin:test
      - name: Build webapp
        run: pnpm run build
      - name: Build admin webapp
        run: pnpm run admin:build
