name: Performance Regression Tracking

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "global.json"
      - ".github/workflows/performance.yml"
      - "Hagalaz.Benchmarks/**"
      - "Hagalaz.Authorization.Constants/**"
      - "Hagalaz.Collections/**"
      - "Hagalaz.Collections.Extensions/**"
      - "Hagalaz.Utilities/**"
      - "Hagalaz.Security/**"
      - "Hagalaz.Cache/**"
      - "Hagalaz.Cache.Abstractions/**"
      - "Hagalaz.Cache.Extensions/**"
      - "Hagalaz.Game.Utilities/**"
      - "Hagalaz.Game.Abstractions/**"
      - "Hagalaz.ServiceDefaults/**"
      - "Hagalaz.Services.Abstractions/**"
      - "Hagalaz.Services.Cache/**"
      - "Hagalaz.Services.Common/**"
      - "Hagalaz.Services.Extensions/**"
      - "Raido.Common/**"
      - "TestSupport/Fixtures/maps/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore Hagalaz.Benchmarks/Hagalaz.Benchmarks.csproj --configfile NuGet.config --locked-mode

      - name: Build
        run: dotnet build Hagalaz.Benchmarks/Hagalaz.Benchmarks.csproj --configuration Release --no-restore --verbosity minimal

      - name: Detect changed benchmark inputs
        id: changes
        if: github.event_name == 'pull_request' && github.event.pull_request.base.sha
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            snapshot:
              - 'Hagalaz.Cache/CacheApi.cs'
              - 'Hagalaz.Cache/ArchiveSnapshotCache.cs'
              - 'Hagalaz.Cache/ArchiveSnapshotLoader.cs'
              - 'Hagalaz.Cache/Models/ArchiveSnapshot.cs'
            relevant:
              - '**'
              - '!Hagalaz.Cache.Tests/**/*.cs'
              - '!openspec/changes/**'

      - name: Run Benchmarks
        shell: bash
        env:
          CACHE_ONLY: ${{ steps.changes.outcome == 'success' && steps.changes.outputs.snapshot == 'true' && steps.changes.outputs.snapshot_count == steps.changes.outputs.relevant_count }}
        run: |
          filters=('*')
          if [[ "$CACHE_ONLY" == 'true' ]]; then
            filters=('*Cache*Benchmarks*' '*Map*Benchmarks*' '*HagalazBenchmarks.FileStore_*')
          fi
          printf 'Selected BenchmarkDotNet filters: %s\n' "${filters[*]}"
          dotnet run --configuration Release --project Hagalaz.Benchmarks \
            --no-build --no-restore -- \
            --job short --warmupCount 3 --iterationCount 5 --filter "${filters[@]}" \
            --exporters json --artifacts ./BenchmarkDotNet.Artifacts

      - name: Diagnose tracked project changes
        if: always()
        run: |
          git status --short
          git diff -- Hagalaz.Game.Common.Tests/Hagalaz.Game.Common.Tests.csproj

      - name: Merge Benchmark Results
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find BenchmarkDotNet.Artifacts/results -type f -name '*-report-full-compressed.json' -print | sort)
          if (( ${#reports[@]} == 0 )); then
            echo "No BenchmarkDotNet JSON reports were produced."
            exit 1
          fi
          jq -s '.[0] * {Benchmarks: (map(.Benchmarks // []) | add)}' "${reports[@]}" \
            > BenchmarkDotNet.Artifacts/results/Hagalaz.Benchmarks-report-full.json
          jq -e '.Benchmarks | length > 0 and all(.[]; .Statistics != null)' \
            BenchmarkDotNet.Artifacts/results/Hagalaz.Benchmarks-report-full.json > /dev/null || {
            echo '::error::Benchmark results are incomplete; comparison and baseline publication are unavailable.'
            exit 1
          }

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts/results
          if-no-files-found: ignore
          retention-days: 7

  compare:
    name: Compare Benchmark Results
    if: github.event_name != 'push'
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download Benchmark Results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts/results

      - name: Verify comparison baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git show FETCH_HEAD:dev/bench/data.js | sed '1s/^window\.BENCHMARK_DATA = //' > "$RUNNER_TEMP/benchmark-baseline.json"
          jq -e --slurpfile baseline "$RUNNER_TEMP/benchmark-baseline.json" '
            .Benchmarks as $current |
            ($baseline[0].entries["Hagalaz Performance Benchmarks"] | last | .benches) as $previous |
            ($current | length > 0) and ($previous | length > 0) and
            ([$current[].FullName] - [$previous[].name] | length == 0)
          ' BenchmarkDotNet.Artifacts/results/Hagalaz.Benchmarks-report-full.json > /dev/null || {
            echo '::error::Benchmark comparison unavailable: the main baseline is missing or lacks current benchmark cases.'
            exit 1
          }

      - name: Compare Benchmark Results (advisory regressions)
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Hagalaz Performance Benchmarks
          tool: benchmarkdotnet
          output-file-path: BenchmarkDotNet.Artifacts/results/Hagalaz.Benchmarks-report-full.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: "200%"
          comment-on-alert: false
          summary-always: true
          fail-on-alert: false
          save-data-file: false

  publish:
    name: Publish Benchmark Baseline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: benchmark
    concurrency:
      group: performance-baseline-publish
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download Benchmark Results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts/results

      - name: Store Benchmark Results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Hagalaz Performance Benchmarks
          tool: benchmarkdotnet
          output-file-path: BenchmarkDotNet.Artifacts/results/Hagalaz.Benchmarks-report-full.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: false
          summary-always: true
          fail-on-alert: false
          save-data-file: true
