<mat-card appearance="outlined" class="studio-tabs mb-4 overflow-hidden">
    <nav mat-tab-nav-bar mat-stretch-tabs="false" [tabPanel]="cachePanel" [class.widget-tabs]="activeKind() === 'widgets'" aria-label="Cache type">
        @for (kind of kinds; track kind) {
            @let path = tabPath(kind);
            <a mat-tab-link [attr.aria-label]="kindLabels[kind]" [routerLink]="path" [queryParams]="{kind: path === '/cache/types' ? kind : null, query: null, offset: null, page: null}" queryParamsHandling="merge" [active]="activeKind() === kind"><mat-icon class="studio-icon-small mr-2" aria-hidden="true">{{kindIcons[kind]}}</mat-icon>{{kindLabels[kind]}}</a>
        }
    </nav>
</mat-card>
<mat-tab-nav-panel #cachePanel><router-outlet /></mat-tab-nav-panel>
