<div class="mx-auto max-w-7xl px-4 pb-8 sm:px-6">
    <header>
        <mat-toolbar class="admin-toolbar">
            <span>Hagalaz admin</span>
            <div class="flex min-w-0 items-center gap-2 sm:gap-4">
                <span class="account-name supporting-text">{{ authStore.user()?.preferred_username }}</span>
                <button type="button" mat-button (click)="logout()"><mat-icon>logout</mat-icon>Sign out</button>
            </div>
        </mat-toolbar>
        <nav mat-tab-nav-bar mat-stretch-tabs="false" [tabPanel]="pagePanel" aria-label="Cache tools">
            <a mat-tab-link href="/cache/types" routerLink="/cache/types" routerLinkActive #typesLink="routerLinkActive" [active]="typesLink.isActive" ariaCurrentWhenActive="page">
                <mat-icon class="mr-2">inventory_2</mat-icon>Types
            </a>
            <a mat-tab-link href="/cache/sprites" routerLink="/cache/sprites" routerLinkActive #spritesLink="routerLinkActive" [active]="spritesLink.isActive" ariaCurrentWhenActive="page">
                <mat-icon class="mr-2">image</mat-icon>Sprites
            </a>
        </nav>
    </header>
    <mat-tab-nav-panel #pagePanel>
        <div class="pt-6 sm:pt-8"><router-outlet></router-outlet></div>
    </mat-tab-nav-panel>
</div>
