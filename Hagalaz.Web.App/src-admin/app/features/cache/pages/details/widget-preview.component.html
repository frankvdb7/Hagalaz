<mat-card appearance="outlined" class="preview-card">
    <mat-toolbar class="preview-toolbar" role="group" aria-label="Preview tools">
        <mat-button-toggle-group aria-label="Preview mode" hideSingleSelectionIndicator [value]="pan()" (change)="pan.set($event.value)">
            <mat-button-toggle [value]="false" matTooltip="Select components" aria-label="Select components"><mat-icon>near_me</mat-icon></mat-button-toggle>
            <mat-button-toggle [value]="true" matTooltip="Pan preview" aria-label="Pan preview"><mat-icon>open_with</mat-icon></mat-button-toggle>
        </mat-button-toggle-group>
        <button mat-icon-button type="button" matTooltip="Reset preview and local edits" aria-label="Reset preview and local edits" (click)="reset(stage)"><mat-icon>restart_alt</mat-icon></button>
        <button mat-icon-button type="button" matTooltip="Duplicate component in preview" aria-label="Duplicate component in preview" [disabled]="selectedId() === null" (click)="duplicate.emit()"><mat-icon>content_copy</mat-icon></button>
        <button mat-icon-button type="button" matTooltip="Remove component from preview" aria-label="Remove component from preview" [disabled]="selectedId() === null" (click)="remove.emit()"><mat-icon>delete_outline</mat-icon></button>
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="preview-zoom">
            <mat-label>Preview zoom</mat-label>
            <mat-select [value]="zoomMode()" (selectionChange)="zoomMode.set($event.value)">
                <mat-option value="fit">Fit</mat-option>
                <mat-option value="0.5">50%</mat-option><mat-option value="0.75">75%</mat-option><mat-option value="1">100%</mat-option>
                <mat-option value="1.25">125%</mat-option><mat-option value="1.5">150%</mat-option><mat-option value="2">200%</mat-option>
            </mat-select>
        </mat-form-field>
        <span class="tool-spacer"></span>
        <button mat-icon-button type="button" matTooltip="Show component bounds" aria-label="Show component bounds" [attr.aria-pressed]="outlines()" (click)="outlines.update(toggle)"><mat-icon>select_all</mat-icon></button>
        <button mat-icon-button type="button" [matTooltip]="expanded() ? 'Close expanded preview' : 'Expand preview'"
            [attr.aria-label]="expanded() ? 'Close expanded preview' : 'Expand preview'" [attr.aria-pressed]="expanded()" (click)="expanded.update(toggle)"><mat-icon>{{ expanded() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon></button>
    </mat-toolbar>
    <div #stage class="preview-stage" [class.pan]="pan()" (pointerdown)="startPan($event, stage)" (pointermove)="movePan($event, stage)"
        (pointerup)="endPan()" (lostpointercapture)="endPan()">
        <div class="preview-space">
            <div class="preview-size" [style.width.px]="viewport().width * zoom()" [style.height.px]="viewport().height * zoom()">
                <div class="preview-art" [style.width.px]="viewport().width" [style.height.px]="viewport().height" [style.transform]="'scale(' + zoom() + ')'">
                    @for (layer of layers(); track layer.component.id) {
                        @let entry = layer.component;
                        @if (layer.visible || selectedId() === entry.id) {
                            <button type="button" class="preview-layer" [class.bounds]="outlines()" [class.selected]="selectedId() === entry.id"
                                [disabled]="pan()" [attr.aria-label]="'Select ' + componentLabel(entry)" [attr.aria-pressed]="selectedId() === entry.id"
                                [style.left.px]="layer.x" [style.top.px]="layer.y" [style.width.px]="layer.width" [style.height.px]="layer.height"
                                (click)="select.emit(entry.id)">
                                @if (layer.visible) {
                                    <span class="layer-appearance" [style.color]="color(entry.color)" [style.opacity]="1 - (entry.transparency ?? 0) / 256">
                                        @switch (entry.type) {
                                            @case (3) { <span class="widget-rectangle" [class.filled]="entry.filled"></span> }
                                            @case (4) {
                                                <cache-widget-text [layer]="layer" />
                                            }
                                            @case (5) {
                                                @if (entry.spriteId !== undefined && entry.spriteId >= 0) {
                                                    <cache-widget-sprite [id]="entry.spriteId" [tiled]="entry.spriteTiled ?? false"
                                                        [style.transform]="spriteTransform(entry)" />
                                                }
                                            }
                                            @case (6) { <cache-widget-model [layer]="layer" /> }
                                            @case (9) {
                                                <span class="widget-line" [style.width.px]="lineLength(layer.width, layer.height)"
                                                    [style.height.px]="entry.lineWidth" [style.top.px]="entry.lineReversed ? layer.height : 0"
                                                    [style.transform]="'rotate(' + lineAngle(entry.lineReversed ? -layer.height : layer.height, layer.width) + 'rad)'"></span>
                                            }
                                        }
                                    </span>
                                }
                            </button>
                        }
                    }
                </div>
            </div>
        </div>
    </div>
</mat-card>
