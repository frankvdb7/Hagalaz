<form class="grid grid-flow-row" novalidate (submit)="onSubmit($event)">
    <mat-form-field appearance="fill" color="primary">
        <mat-label>Email address</mat-label>
        <input [formField]="form.email" type="email" matInput autocomplete="email" />
        <mat-icon matSuffix>email</mat-icon>
        <mat-error>Please fill in a valid email address</mat-error>
    </mat-form-field>
    <mat-form-field appearance="fill" color="primary">
        <mat-label>Password</mat-label>
        <input [formField]="form.password" type="password" matInput autocomplete="new-password" />
        <mat-icon matSuffix>lock</mat-icon>
        <mat-error>A password is required</mat-error>
    </mat-form-field>
    <mat-form-field appearance="fill" color="primary">
        <mat-label>Confirm password</mat-label>
        <input [formField]="form.passwordConfirm" type="password" matInput autocomplete="new-password" />
        <mat-icon matSuffix>lock</mat-icon>
        <mat-error>A confirmation of your password is required</mat-error>
    </mat-form-field>
    <div class="mb-4 text-center align-middle">
        <mat-checkbox [formField]="form.accepted" color="primary"></mat-checkbox>
        <span
            >I agree to the
            <a class="text-primary hover:underline" href="/terms" [routerLink]="['/terms']">Terms</a>
            and
            <a class="text-primary hover:underline" href="/privacy" [routerLink]="['/privacy']">Privacy Policy</a></span
        >
    </div>
    <button mat-flat-button color="primary" type="submit">Sign up</button>
</form>
